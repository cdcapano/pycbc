; IMR injection used to test the gated_gaussian_multimargphasepol model.
; The parameters are the inspiral__ maximum likelihood parameters in
; examples/inference/time_marg_bhspec/expected_maxl-gw150914.json, with the
; inspiral__ prefix removed. The approximant and static parameters are taken
; from examples/inference/time_marg_bhspec/gw150914_hierarchical_gated.ini.
; The polarization is not in the expected maxl file (it was marginalized
; over), so an arbitrary value is used.
;
; Create the injection file with:
;
;   pycbc_create_injections --config-files injection.ini --ninjections 1 \
;       --seed 10 --output-file injection.hdf \
;       --variable-params-section variable_params \
;       --static-params-section static_params --dist-section prior --force

[variable_params]

[static_params]
approximant = IMRPhenomXPHM
f_lower = 20.0
f_ref = 20
taper = start
trigger_time = 1126259462.43
ra = 0.9122465496513537
dec = -0.6969462844463007
delta_tc = -0.006457389096415349
polarization = 1.75
coa_phase = 2.586815956120157
comoving_volume = 16595687.613067493
inclination = 2.5215290871288447
q = 1.7353853407436473
srcmchirp = 28.02410304066494
spin1_a = 0.8682998749756695
spin1_azimuthal = 5.273046584995996
spin1_polar = 1.9729369037587683
spin2_a = 0.05556640970565169
spin2_azimuthal = 2.0789606376164578
spin2_polar = 1.3733749760294445

[waveform_transforms-tc]
name = custom
inputs = trigger_time, delta_tc
tc = trigger_time + delta_tc

[waveform_transforms-redshift]
name = custom
inputs = comoving_volume
redshift = redshift_from_comoving_volume(comoving_volume)

[waveform_transforms-distance]
name = custom
inputs = comoving_volume
distance = distance_from_comoving_volume(comoving_volume)

[waveform_transforms-mass1]
name = custom
inputs = srcmchirp, q, redshift
mass1 = mass1_from_mchirp_q(srcmchirp, q) * (1 + redshift)

[waveform_transforms-mass2]
name = custom
inputs = srcmchirp, q, redshift
mass2 = mass2_from_mchirp_q(srcmchirp, q) * (1 + redshift)

[waveform_transforms-spin1x+spin1y+spin1z]
name = spherical_to_cartesian
x = spin1x
y = spin1y
z = spin1z
radial = spin1_a
polar = spin1_polar
azimuthal = spin1_azimuthal

[waveform_transforms-spin2x+spin2y+spin2z]
name = spherical_to_cartesian
x = spin2x
y = spin2y
z = spin2z
radial = spin2_a
polar = spin2_polar
azimuthal = spin2_azimuthal
