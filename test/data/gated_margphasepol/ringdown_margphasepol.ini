; Ringdown-only analysis of an IMR injection using the
; gated_gaussian_multimargphasepol model, which numerically marginalizes
; over polarization and the phase of the 220 mode. This is the ringdown
; submodel of examples/inference/time_marg_bhspec/gw150914_hierarchical_gated.ini
; (with the ringdown__ prefixes removed), modified to:
;   * use the modes version of the ringdown approximant;
;   * marginalize over the phase of the 220 mode (phi221 is then the phase
;     of the 221 relative to the 220);
;   * use the matmul in-painting method;
;   * analyze simulated Gaussian noise with an Advanced LIGO PSD, into which
;     the injection in injection.ini is added.

[variable_params]
ra =
dec =
delta_tc =
inclination =
final_mass =
final_spin =
amp220 =
amp221 =
phi221 =

[static_params]
trigger_time = 1126259462.43
f_lower = 20.0
f_ref = 20
lmns = 222
f_final = 2048
approximant = TdModesfromFinalMassSpin

[prior-delta_tc]
name = uniform
min-delta_tc = -0.05
max-delta_tc = 0.05

[prior-inclination]
name = sin_angle

[prior-final_mass]
name = uniform
min-final_mass = 10
max-final_mass = 200

[prior-final_spin]
name = uniform
min-final_spin = -0.99
max-final_spin = 0.99

[prior-amp220]
name = uniform_log10
min-amp220 = 1e-25
max-amp220 = 8e-17

[prior-amp221]
name = uniform
min-amp221 = 0
max-amp221 = 5

[prior-phi221]
name = uniform_angle

[prior-ra+dec]
name = uniform_sky

[waveform_transforms-tc]
name = custom
inputs = trigger_time, delta_tc
tc = trigger_time + delta_tc

[waveform_transforms-t_gate_start]
name = custom
inputs = tc
t_gate_start = tc - 1.

[waveform_transforms-t_gate_end]
name = custom
inputs = tc
t_gate_end = tc

[model]
name = gated_gaussian_multimargphasepol
low-frequency-cutoff = H1:20.0 L1:20.0
ref_phase = phi220
phase_names = phi220 phi221
phase_samples = 1000
polarization_samples = 1000
paint-method = matmul

[data]
instruments = H1 L1
trigger-time = 1126259462.43
analysis-start-time = -2
analysis-end-time = 2
sample-rate = 2048
fake-strain = H1:aLIGOZeroDetHighPower L1:aLIGOZeroDetHighPower
fake-strain-seed = H1:44 L1:45
psd-model = H1:aLIGOZeroDetHighPower L1:aLIGOZeroDetHighPower
psd-inverse-length = 8
pad-data = 8
strain-high-pass = 10
; the strain module requires a channel name when injecting, even though
; the data is simulated
channel-name = H1:STRAIN L1:STRAIN
injection-file = injection.hdf
